name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            artifact: KeywordAI-mac-arm64

          - os: macos-latest
            platform: darwin/amd64
            artifact: KeywordAI-mac-amd64

          # ubuntu-22.04 is required — Wails v2 calls `pkg-config webkit2gtk-4.0`
          # internally, and that package was dropped in Ubuntu 24.04 (ubuntu-latest).
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: KeywordAI-linux-amd64

          - os: windows-latest
            platform: windows/amd64
            artifact: KeywordAI-windows-amd64

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build
        run: wails build -platform ${{ matrix.platform }}

      - name: Zip artifact (Unix)
        if: runner.os != 'Windows'
        run: zip -r ${{ matrix.artifact }}.zip build/bin/

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
