name: Build and Release

on:
  push:
    tags:
      - "v*.*.*" # triggers on any tag like v1.0.0, v1.2.3-beta, etc.
  workflow_dispatch: # keep for test builds without creating a release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            artifact: KeywordAI-mac-arm64

          - os: macos-latest
            platform: darwin/amd64
            artifact: KeywordAI-mac-amd64

          - os: ubuntu-latest
            platform: linux/amd64
            artifact: KeywordAI-linux-amd64

          - os: windows-latest
            platform: windows/amd64
            artifact: KeywordAI-windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails on Linux requires GTK3 and WebKit. ubuntu-latest (24.04) uses
      # the newer 4.1 variant; Wails v2.7+ supports both.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build
        run: wails build -platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/
          # upload-artifact zips directories automatically, so the macOS
          # .app bundle (which is a folder) is handled correctly.

  release:
    # Only create a GitHub Release when triggered by a version tag.
    # Manual workflow_dispatch runs build everything but skip this step.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases and upload assets

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # auto-generates changelog from commits
          files: artifacts/**/*
